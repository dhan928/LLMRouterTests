[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouter-three-router-demo"
version = "0.1.0"
description = "Barebones KNN, SVM, and MLP routers for choosing an LLM from embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["llmrouter"]

[tool.pytest.ini_options]
testpaths = ["tests/test_simple_routers.py"]
